<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">A tree of knowledge growing from an open book</title>
  <desc id="heroDesc">An illustrated tree with pink leaves and gold stars grows from an open book, surrounded by a graduation cap, pencil, globe and the motto Wisdom Is Wealth.</desc>
